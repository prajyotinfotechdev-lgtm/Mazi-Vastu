<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- Top fade so the contour lines blend seamlessly into the page background -->
    <linearGradient id="fade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="30%" stop-color="#111111" stop-opacity="0" />
      <stop offset="100%" stop-color="#111111" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Solid base color (elevated background for footer) -->
  <rect width="1440" height="400" fill="#111111" />

  <!-- Topographic Contour Lines -->
  <g fill="none" stroke="#f5c518" stroke-width="1.2" opacity="0.1">
    
    <!-- Outer, broad sweeping contours -->
    <path d="M-100,400 Q200,200 600,300 T1500,100" />
    <path d="M-50,450 Q250,220 650,330 T1550,150" />
    <path d="M0,500 Q300,240 700,360 T1600,200" />
    <path d="M50,550 Q350,260 750,390 T1650,250" />

    <!-- Closer, tighter clusters simulating elevation peaks -->
    <path d="M-150,350 Q150,150 550,250 T1400,0" />
    <path d="M-200,300 Q100,100 500,200 T1300,-50" />
    <path d="M-250,250 Q50,50 450,150 T1200,-100" />

    <!-- Right-side sweeping curves -->
    <path d="M800,450 Q1100,200 1500,250" />
    <path d="M850,500 Q1150,250 1550,300" />
    <path d="M900,550 Q1200,300 1600,350" />

    <!-- Left bottom dense clusters -->
    <path d="M100,600 Q400,300 800,450" />
    <path d="M150,650 Q450,350 850,500" />
    <path d="M200,700 Q500,400 900,550" />
  </g>

  <!-- Fading mask applied over the top to make the lines disappear elegantly -->
  <rect x="0" y="0" width="1440" height="150" fill="url(#fade)" />
</svg>
