[build]
buildCommand = "npm install --ignore-scripts && npx prisma generate && npm run build"

[deploy]
startCommand = "sh -c 'npx prisma migrate deploy && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public; node .next/standalone/server.js'"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
